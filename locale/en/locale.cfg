[mod-setting-description]
ec-portrait-size=Height of the Companion's portrait in the conversation window, as a percentage of the screen height. Can also be changed with the - / + buttons of the window.
ec-builds-per-second=How many ghosts the Companion builds per second (applies to both building modes). Default 1.
ec-crafting-speed=Multiplier for how fast the Companion hand-crafts missing items. 1 = same as a player without bonuses.
ec-debug=Prints what the power planner is doing (pump search, plant search, why a spot was rejected) in the chat and the log, and marks the tested spots on the map.
ec-companion-name=The name used in chat messages, the talk window, the map tag and dialogue. (The entity's own tooltip name comes from the locale file.)
ec-loadout-enabled=The Companion keeps these items on it and restocks from chests / the logistic network, always taking the best researched version available. Armor is worn automatically (it adds inventory space).
ec-loadout-inserter=Target amount (best of: stack, bulk, fast, basic). 0 = do not carry.
ec-loadout-belt=Target amount (best of: turbo, express, fast, basic). 0 = do not carry.
ec-loadout-splitter=Target amount (best tier available). 0 = do not carry.
ec-loadout-underground=Target amount (best tier available). 0 = do not carry.
ec-loadout-chest=Target amount (steel, iron, wooden). 0 = do not carry.
ec-loadout-assembler=Target amount (best of assembling machine 3, 2, 1). 0 = do not carry.
ec-loadout-pole=Target amount (substation, medium, small). 0 = do not carry.
ec-loadout-furnace=Target amount (electric, steel, stone). 0 = do not carry.
ec-build-ground=A ghost that stands on water cannot be built. The Companion puts landfill ghosts under it first (the landfill is carried, taken from a chest or crafted like any other item) and builds the ghost once the ground is there.
ec-hop-length=A long trip is walked in hops of this many tiles; each hop has its own short route search. Longer hops = fewer searches but each one costs more (frame rate). Shorter = lighter searches, more of them. 60 is a good start; around 1000-tile trips 60-120 works well.
ec-hop-min-trip=A trip shorter than this is one route search. From this distance on it is walked in hops.
ec-hop-prefetch=While the Companion walks one hop, the next one is already being calculated (low priority, so it does not take the pathfinder's budget). Off: it stands still at the end of each hop until the next route arrives.
ec-skip-bot-ghosts=When a ghost is far away and a logistic network with construction robots covers it and holds the item, the Companion does not make a trip for it: the robots will build it. It is only a check - the Companion still builds ghosts near it, and it never blocks the robots. It looks again while walking, in case robots took the job meanwhile.
ec-bot-skip-distance=Ghosts closer than this are built by the Companion anyway (no long trip to save).
ec-ghost-mark-enabled=The ghost the Companion is building (or fetching the material for) is shaded, so you can see what it is doing. Only a picture: nothing is reserved, robots and you can still build it.
ec-ghost-mark-color=Colour and opacity (the alpha) of the shade.
ec-voice-enabled=Master switch of the voice lines the Companion plays in the world, outside the Talk window. Each situation below can be switched off on its own. Lines are the sound files of sound/voice/ (listed in sound/sounds.lua as voice_<situation>).
ec-voice-volume=Volume of the voice lines. 0 = silent.
ec-voice-gap=Lines never start closer together than this (warnings excepted).
ec-voice-captions=A short text appears above the Companion with each line (for the lines without a voice file yet, or to read along).
ec-voice-idle=A line now and then when it has nothing to do and stands still.
ec-voice-meet=A greeting when it sees you again after a long time without seeing you.
ec-voice-working=A line when it starts a job after a while without one.
ec-voice-crafting=A line when it starts hand-crafting.
ec-voice-thinking=A line when a new research starts (the "thinking" sound).
ec-voice-low_power=A warning when the machines around you cannot get enough power (a sample of the machines within 80 tiles of you). Heard anywhere.
ec-voice-enemy_attack=A warning when several enemy units are near you. Heard anywhere; once per wave.
ec-voice-idle-seconds=How long it has to stand idle before it says something.
ec-voice-meet-minutes=How long it must not have been near you (within 30 tiles) for the greeting.
ec-voice-enemy-radius=Enemy units (3 or more) within this distance of you count as an incoming attack.
ec-teleport-fallback=Off (default): when the game finds no way to a goal, or the Companion stands where it must build, it WALKS - straight at the goal as far as the terrain allows, or out of the footprint. On: it may jump next to the goal / out of the way instead (the old behaviour).
ec-journey-enabled=Off: long trips are walked for real, in hops (the next hop is calculated while the current one is walked). On: a trip this long is not walked at all - the Companion waits for the time the walk would take, shown as "Travelling", then appears about 24 tiles from the goal.
ec-journey-distance=Distance to the goal (tiles) from which the trip becomes a journey.
ec-journey-speed=How fast a journey goes compared to walking: 100 = the time walking would take, 200 = twice as fast.
ec-vehicle-craft=When the goal is far and no vehicle is near, the Companion crafts a car (materials from its inventory and your chests) and puts it down. Vehicles with an empty tank are fuelled with the best fuel it can get.
ec-vehicle-enabled=When the goal is far, a free car / tank / spidertron is near and a drivable route exists, the Companion drives there and gets out near the goal. Trains are never used.
ec-vehicle-min-distance=The goal counts as far when it is at least this many tiles away.
ec-vehicle-search-radius=Only a vehicle within this many tiles of the Companion is used.
ec-vehicle-dismount-distance=The Companion leaves the vehicle when it is this close to the goal and walks the rest.
ec-vehicle-show-route=Draws the route the Companion drives on the map (orange line, circle at the destination).
ec-vehicle-goal-tolerance=The drivable route may end up to this many tiles from the goal (the goal is often built over or blocked). The Companion walks the rest. Raise this if it says there is no room to drive.
ec-vehicle-body-scale=How much of the vehicle's collision box the route search keeps clear. Lower = it may squeeze through narrower gaps (and may scrape things). 100 = the full size.
ec-vehicle-dismount-speed=Near the goal the Companion brakes and only gets out once the vehicle is slower than this. It never stops or gets out on a rail: it rolls on until it is clear of the tracks.
ec-vehicle-rail-check=When the route crosses train tracks, the Companion slows down, and if a moving train could reach the crossing before it is across, it stops in front of the tracks (never on them) and crosses when the train has passed or stopped. Trains standing still are not waited for.
ec-vehicle-train-time=How many seconds ahead a train's travel is projected when deciding whether the crossing is safe, on top of the time the vehicle needs to cross. Higher = more cautious (waits for trains that are farther away).
ec-vehicle-aim-distance=How far ahead along the route the Companion aims while driving (it looks up to twice this far when going fast). The white circle in the debug view is the route's aim point, the green one the steered aim point. Longer = smoother, wider turns; shorter = follows the route more tightly.
ec-vehicle-max-speed=Override for the driving speed, in km/h. 0 (default) = no limit of its own: the Companion drives as fast as the vehicle itself can. It still slows down for bends, sharp turns, tight spaces, rail crossings and the last stretch before the goal (those slow-downs scale with the override when it is set). With debug on, the chat shows the current speed limit.
ec-vehicle-steer-size=How big the driving Companion treats the vehicle for route planning and steering, as a percentage of its half length (a circle around the whole body, so it holds at any heading). Raise it if the vehicle still clips things, lower it for tight spaces. The yellow circle in the debug view shows this size.
ec-vehicle-steer-margin=Extra distance, on top of the vehicle's own size, that the driving Companion tries to keep from walls, buildings, cliffs, trees and water. The game's route is the shortest one and hugs corners; this steers the vehicle away from them so it takes corners wide. 0 = off (follow the route exactly). Lower it if the vehicle refuses narrow gaps, raise it if it still scrapes corners.
ec-vehicle-route-timeout=How long to wait for the game to find a route before giving up and walking. Long trips need more time.

